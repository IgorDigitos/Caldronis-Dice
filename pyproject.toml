[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caldronis-dice"
version = "0.1.0"
description = "Rolador de dados para Discord com atributos por servidor"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.6,<3", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools]
py-modules = ["bot", "config", "message_handler"]

[tool.setuptools.packages.find]
include = ["dice*", "profiles*", "commands*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
